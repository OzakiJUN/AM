syntax = "proto3";

package am.v1;

option go_package = "github.com/OzakiJUN/am/gen/go/am/v1;amv1";

import "am/v1/common.proto";

// HTTP API messages.
//
// HTTP bodies are these messages encoded as protobuf JSON (protojson):
// field names in lowerCamelCase, 64-bit integers as strings.
// Authenticated endpoints need the header `Authorization: Bearer <token>`.
// Errors return a non-2xx status with an `Error` body.

// POST /api/v1/register
message RegisterRequest {
  string invite_code = 1;
  string username = 2;
  string password = 3;
  string display_name = 4;
  string device_name = 5;
}

// POST /api/v1/login
message LoginRequest {
  string username = 1;
  string password = 2;
  string device_name = 3;
  // Only for accounts that left the server: an unused invite code lets them
  // back in (used up like a registration). Ignored for everyone else.
  string invite_code = 4;
}

// Response of register and login.
message SessionResponse {
  string token = 1;
  User me = 2;
}

// GET /api/v1/sessions
message ListSessionsResponse {
  repeated DeviceSession sessions = 1;
  // Most devices a human account may be logged in on (limits.max_devices);
  // 0 = no limit.
  int32 max_devices = 2;
}

// POST /api/v1/logout logs out the device making the request (empty body).

// POST /api/v1/pair: a one-time ticket that logs in a new device of mine
// (docs/design.md §7, 多设备). Refused with too_many_devices when the
// account is already on limits.max_devices devices. A new ticket replaces
// the previous unused one.
message CreatePairTicketRequest {
  // Encrypted data for the new device, at most 32 KiB; kept with the ticket
  // and handed over when it is redeemed. Opaque to the server.
  bytes bundle = 1;
}

message PairTicket {
  string ticket = 1;
  int64 expires_at = 2;
}

// POST /api/v1/pair/redeem (no token): uses up the ticket and logs the new
// device in. invalid_pair_code when it is wrong, used or expired.
message RedeemPairTicketRequest {
  string ticket = 1;
  string device_name = 2;
}

message PairRedeemResponse {
  string token = 1;
  User me = 2;
  bytes bundle = 3;
}

// GET /api/v1/me/client-state: data shared by my devices (the list of my
// servers), encrypted by the client. Empty data and updated_at 0 = none yet.
message ClientState {
  bytes data = 1;
  int64 updated_at = 2;
}

// PUT /api/v1/me/client-state (replies ClientState). At most 32 KiB.
// state_conflict when another device saved since base_updated_at.
message PutClientStateRequest {
  bytes data = 1;
  int64 base_updated_at = 2;
}

message DeviceSession {
  int64 id = 1;
  string device_name = 2;
  int64 created_at = 3;
  int64 last_seen = 4;
  // True for the session making this request.
  bool current = 5;
}

// DELETE /api/v1/sessions/{id} -> Empty

// GET /api/v1/invites   (list my codes)
// POST /api/v1/invites  (create one, if under the per-user limit)
message ListInvitesResponse {
  repeated Invite invites = 1;
  // How many more codes this user can still create.
  int32 remaining = 2;
}

message Invite {
  string code = 1;
  int64 created_at = 2;
  // 0 = unused.
  int64 used_by = 3;
  string used_by_name = 4;
  // Join code: server address + certificate pin + this invite code in one
  // obfuscated string (see docs/protocol.md). Empty when the server has no
  // public address set; clients then build it from the address they use.
  string join_code = 5;
  // URL for a QR code: the client download page with "#join=<join_code>".
  string join_url = 6;
}

// GET /api/v1/server (no login needed)
message ServerInfo {
  string name = 1;
  string version = 2;
  // Client download page; QR codes point here.
  string download_url = 3;
  // Server icon ("/api/v1/server/icon?v=..."), "" when none is set. Public.
  string icon = 4;
  // Random id of the running server process: lets the server (and clients)
  // check that a new address really reaches this same server.
  string instance_id = 5;
  // AI plugins (NoneBot) can be uploaded on this server (plugins.enabled).
  bool plugins = 6;
  // AIs can be hosted on this server (hosting.enabled, max_per_user > 0).
  bool hosting = 7;
  // Commands of the server's built-in bot (names and aliases, without the
  // leading "/"); AIs leave messages starting with these alone.
  repeated string commands = 8;
  // The built-in bot's account (0 = none).
  int64 helper_id = 9;
  // Newest client version this server keeps a verified installer of ("" =
  // none). The signed manifest is GET /api/v1/update/release.json (+ .sig),
  // the installer GET /api/v1/update/client (docs/release.md).
  string client_version = 10;
}

// Who may rearrange the widgets on the server profile.
enum ProfileEditors {
  PROFILE_EDITORS_UNSPECIFIED = 0;
  // Site admins only (default).
  PROFILE_EDITORS_ADMINS = 1;
  PROFILE_EDITORS_EVERYONE = 2;
}

// GET /api/v1/server/profile: the server's profile page. Set up by the site
// admin in the admin panel.
message ServerProfile {
  string name = 1;
  string description = 2;
  // Same as ServerInfo.icon.
  string icon = 3;
  // Accounts that are not banned and have not left.
  int32 member_count = 4;
  // Online and not invisible.
  int32 online_count = 5;
  ProfileEditors layout_editors = 6;
  // Members may change what is inside widgets (never their kind or place).
  // When on, each widget can also get its own rule (widgets: later batch).
  bool widget_content_editable = 7;
}

// ---- friends (removed) ----
// There are no friends any more (stage 1 batch 4): everyone on a server can
// message everyone else. These messages and endpoints are gone; the
// messages stay only so their names and field numbers are never reused.

// Removed: GET /api/v1/friends
message ListFriendsResponse {
  repeated User friends = 1;
  repeated User incoming = 2;
  repeated User outgoing = 3;
}

// Removed: POST /api/v1/friends/request
message FriendRequest {
  string username = 1;
}

// Removed: POST /api/v1/friends/accept
message FriendAccept {
  int64 user_id = 1;
}

// ---- people ----

// POST /api/v1/dm   -> Conversation
// Opens (or returns the existing) DM with anyone on the server, unless one
// of the two has blocked the other ("blocked").
message OpenDMRequest {
  int64 user_id = 1;
}

// GET /api/v1/users?query=&after=&limit=   -> ListUsersResponse
// Everyone on the server (not banned), ordered by id. `query` matches
// username or display name. Page with `after` = last id of the previous page.
message ListUsersResponse {
  repeated User users = 1;
  // Pass as `after` for the next page; 0 = no more.
  int64 next_after = 2;
}

// GET    /api/v1/blocks             -> ListBlocksResponse
// POST   /api/v1/blocks/{user_id}   -> Empty
// DELETE /api/v1/blocks/{user_id}   -> Empty
// A block stops direct messages both ways; channels are not affected.
message ListBlocksResponse {
  repeated User users = 1;
}

// GET /api/v1/conversations/{id}   -> Conversation (must be a member)
// GET /api/v1/users/{id}           -> User

// PATCH /api/v1/me   -> User
message UpdateProfileRequest {
  optional string display_name = 1;
  // Media id of an uploaded image (GIF allowed). 0 removes the avatar.
  optional int64 avatar_media_id = 2;
  // Personal signature, at most 100 characters. Empty clears it.
  optional string bio = 3;
}

// PUT /api/v1/me/presence -> Presence (as the user themselves sees it).
// Saved on the server, so it stays after reconnecting or restarting.
message SetPresenceRequest {
  // Appear offline to everyone except yourself and your own bot / ai
  // accounts (so your AI knows you are around and may give it away).
  bool invisible = 1;
  // Empty / UNSPECIFIED clears the activity.
  Activity activity = 2;
}

// GET /api/v1/me/logins
message ListLoginRecordsResponse {
  repeated LoginRecord records = 1;
}

message LoginRecord {
  // "login" or "register"
  string kind = 1;
  string ip = 2;
  string device_name = 3;
  int64 created_at = 4;
}

// ---- channels (groups) ----
// Clients call groups "channels". Public channels are open to everyone on
// the server; private ones are invite only (the old groups).

// POST /api/v1/groups   -> Conversation
message CreateGroupRequest {
  string name = 1;
  repeated int64 member_ids = 2;
  // Public channel: only site admins may create one. Every account on the
  // server becomes a member (member_ids is ignored).
  bool public = 3;
}

// GET /api/v1/channels   -> ListChannelsResponse
// All public channels, for the "browse channels" list.
message ListChannelsResponse {
  repeated ChannelInfo channels = 1;
}

message ChannelInfo {
  int64 id = 1;
  string name = 2;
  string avatar = 3;
  string notice = 4;
  int32 member_count = 5;
  // The caller is a member.
  bool joined = 6;
}

// POST /api/v1/channels/{id}/join   -> Conversation
// Join a public channel (e.g. after leaving it).

// POST /api/v1/groups/{id}/members
// Invite people. In groups with join approval, invitations by ordinary
// members become join requests for admins to approve.
message InviteMembersRequest {
  repeated int64 user_ids = 1;
}

message InviteMembersResponse {
  repeated int64 added = 1;
  repeated int64 requested = 2;
}

// DELETE /api/v1/groups/{id}/members/{user_id}   -> Empty
// Your own id = leave; someone else's = kick.

// PATCH /api/v1/groups/{id}   -> Conversation
message UpdateGroupRequest {
  optional string name = 1;
  // Media id of an uploaded image. 0 removes the avatar.
  optional int64 avatar_media_id = 2;
  optional string notice = 3;
  optional bool join_approval = 4;
  // Adult content allowed in this channel (AIs drawing).
  optional bool nsfw = 5;
}

// POST   /api/v1/groups/{id}/admins/{user_id}  -> Empty   (owner only)
// DELETE /api/v1/groups/{id}/admins/{user_id}  -> Empty

// POST /api/v1/groups/{id}/transfer   -> Empty   (owner only)
message TransferGroupRequest {
  int64 user_id = 1;
}

// DELETE /api/v1/groups/{id}   -> Empty   (owner only; dissolves the group)

// PUT /api/v1/conversations/{id}/pin -> Conversation. Pins a channel or DM
// to the top of my list (my own setting, shared by my devices).
message SetPinnedRequest {
  bool pinned = 1;
}

// PUT /api/v1/conversations/{id}/dnd -> Conversation. Do not disturb: no
// notifications, unread shown grey. until: unix ms, 0 = off, -1 = until
// turned off.
message SetDndRequest {
  int64 until = 1;
}

// POST /api/v1/groups/{id}/mute   -> Empty
message MuteMemberRequest {
  int64 user_id = 1;
  // How long to mute, in seconds. 0 = unmute.
  int64 duration_seconds = 2;
}

// GET /api/v1/groups/{id}/requests
message ListJoinRequestsResponse {
  repeated JoinRequestInfo requests = 1;
}

message JoinRequestInfo {
  User user = 1;
  User inviter = 2;
  int64 created_at = 3;
}

// POST /api/v1/groups/{id}/requests/{user_id}/approve  -> Empty
// POST /api/v1/groups/{id}/requests/{user_id}/reject   -> Empty

// ---- moderation ----

// POST /api/v1/events/{event_id}/delete   -> Empty
// Group owner / admins (for messages of lower-ranked members) and site admins.
message AdminDeleteRequest {
  string reason = 1;
  // Also add the image's fingerprint to the blocklist.
  bool block_media = 2;
}

// ---- media ----

// POST /api/v1/media   (multipart/form-data, field "file")  -> MediaInfo
// GET  /api/v1/media/{id}         original file
// GET  /api/v1/media/{id}/thumb   thumbnail / static first frame (images)
message MediaInfo {
  int64 id = 1;
  string mime = 2;
  int64 size = 3;
  int32 width = 4;
  int32 height = 5;
  string name = 6;
  bool is_image = 7;
  string url = 8;
  string thumb_url = 9;
}

message Empty {}

// ---- AI / bot accounts (docs/design.md §9, §10) ----
// Only the owner (a human account) may use these. The AI runs on one device
// of its owner, which logs in as the AI with POST /api/v1/ai/{id}/run.

// GET /api/v1/ai
message ListAIResponse {
  repeated AIAccount ais = 1;
}

message AIAccount {
  User user = 1;
  // The owner's settings for it (persona, model, runner device, ...), JSON
  // kept as it is by the server; only the owner can read it.
  string settings = 2;
  int64 settings_updated_at = 3;
  // People waiting for me to let them talk with it (share requests).
  int32 share_requests = 4;
  // Hosted on the server (or asked for); unset when it isn't.
  AIHosting hosting = 5;
}

// An AI hosted on the server (docs/design.md §10 托管).
message AIHosting {
  // pending | approved | rejected
  string status = 1;
  string reject_reason = 2;
  int64 requested_at = 3;
  // The client running it on the server: off | starting | running | error
  string state = 4;
  string error = 5;
  // Its own folder on the server for its file tools.
  string work_dir = 6;
}

// POST /api/v1/ai/{id}/host -> AIHosting
message HostAIRequest {
  // My model providers for it (the client's JSON, keys included); stored
  // encrypted on the server and given to the host client only.
  string providers_json = 1;
}

// POST /api/v1/ai -> AIAccount
message CreateAIRequest {
  string display_name = 1;
}

// PATCH /api/v1/ai/{id} takes UpdateProfileRequest (name, avatar, bio) -> User.

// PUT /api/v1/ai/{id}/settings -> AIAccount. At most 64 KiB of JSON.
// state_conflict when saved elsewhere since base_updated_at.
message PutAISettingsRequest {
  string settings = 1;
  int64 base_updated_at = 2;
}

// POST /api/v1/ai/{id}/run -> SessionResponse: logs this device in as the
// AI (it becomes the device that runs it); the AI's other sessions end.
message RunAIRequest {
  string device_name = 1;
}

// DELETE /api/v1/ai/{id} -> Empty: the AI leaves the server for good.

// POST /api/v1/ai/{id}/room -> Conversation: a shared room with my AI, a
// private group owned by me with the AI and the people listed; I add or
// remove people later like in any channel.
message CreateAIRoomRequest {
  string name = 1;
  repeated int64 member_ids = 2;
}

// ---- stickers (docs/design.md §11) ----

// One sticker in my collection. A shared one (library_id != 0) points at a
// picture in the server's shared library (LibrarySticker): its picture is
// the library's (the earliest upload of it) and its tags are everyone's
// tags for it. A private one is only mine: my own picture, my own tags.
message Sticker {
  int64 id = 1;
  int64 media_id = 2;
  // At most 10 tags, 20 characters each (trimmed, no duplicates) for a
  // private one; up to 20 for a shared one, most-added first.
  repeated string tags = 3;
  int64 created_at = 4;
  // The shared library entry, 0 = not shared (private, or the library is
  // turned off on this server).
  int64 library_id = 5;
  bool private = 6;
  // Who first uploaded the picture (shared ones).
  int64 uploader_id = 7;
  // SHA-256 (hex) of the picture file.
  string sha256 = 8;
  // The tags I added myself (the ones I can take off again). For a private
  // sticker all of them.
  repeated string my_tags = 9;
}

// GET /api/v1/stickers -> ListStickersResponse: mine, newest first.
message ListStickersResponse {
  repeated Sticker stickers = 1;
}

// POST /api/v1/stickers -> Sticker. The image must be my own upload or a
// picture I can see (from a chat). Shared unless private is set
// (stickers.default_public decides when it is not): a picture that is
// already in the shared library (same file, or one that looks the same) is
// merged into it. Adding the same picture again returns the sticker already
// there with the new tags added. At most limits.max_stickers per person
// (sticker_limit).
message AddStickerRequest {
  int64 media_id = 1;
  repeated string tags = 2;
  optional bool private = 3;
}

// PATCH /api/v1/stickers/{id} -> Sticker. Replaces the tags: for a shared
// sticker only my own tags change (tags other people added stay).
// DELETE /api/v1/stickers/{id} -> Empty. A shared picture leaves the library
// when nobody has it any more.
message UpdateStickerRequest {
  repeated string tags = 1;
}

// POST /api/v1/stickers/{id}/private -> Sticker. Private: only mine (my
// tags are kept; the library entry is taken down if nobody else has it).
// Shared: goes into the library (my tags go with it).
message SetStickerPrivateRequest {
  bool private = 1;
}

// One picture in the server's shared sticker library (docs/design.md §11).
message LibrarySticker {
  int64 id = 1;
  int64 media_id = 2;
  // Everyone's tags, most-added first (at most 20).
  repeated string tags = 3;
  // The ones I added.
  repeated string my_tags = 4;
  // Who first uploaded the picture.
  int64 uploader_id = 5;
  // How many people have it in their collection.
  int32 collectors = 6;
  int64 created_at = 7;
  // My sticker for it, 0 = not in my collection.
  int64 my_sticker_id = 8;
  int32 width = 9;
  int32 height = 10;
}

// GET /api/v1/sticker-library?q=&sort=hot|new&offset= -> ListLibraryResponse.
// q: words separated by spaces, each must be part of one of the tags.
// sort: hot = most collected first (default), new = newest first.
message ListLibraryResponse {
  repeated LibrarySticker items = 1;
  // Pass as offset for the next page; 0 = no more.
  int32 next_offset = 2;
  // The library is turned off on this server (stickers.library).
  bool disabled = 3;
}

// POST /api/v1/sticker-library/{id}/collect -> Sticker: put it into my
// collection (the existing one if it is already there).
// PATCH /api/v1/sticker-library/{id}/tags -> LibrarySticker. Anyone can add
// tags (at most 20 per picture, sticker_tags_full); I can take off the ones
// I added, a site admin any.
message EditLibraryTagsRequest {
  repeated string add = 1;
  repeated string remove = 2;
}

// POST /api/v1/sticker-library/lookup -> LookupStickersResponse: which of
// these files (SHA-256, hex, at most 200) the library already has, so a
// client copying my stickers from another server collects them instead of
// uploading.
message LookupStickersRequest {
  repeated string sha256 = 1;
}

message LookupStickersResponse {
  // sha256 -> library id, only the ones found.
  map<string, int64> library_ids = 1;
}

// ---- music links (docs/design.md §7, music widgets) ----

// POST /api/v1/music/resolve -> ResolveMusicResponse. Reads a NetEase Cloud
// Music song or playlist link (also the short 163cn.tv ones): title,
// artist, tracks, and the cover, which is copied into my uploads
// (cover_media_id) so visitors load it from this server.
// music_link_invalid / music_unavailable.
message ResolveMusicRequest {
  string url = 1;
}

message MusicTrack {
  string netease_id = 1;
  string title = 2;
  string artist = 3;
}

message ResolveMusicResponse {
  // "song" or "playlist".
  string kind = 1;
  string netease_id = 2;
  string title = 3;
  // Song: its artists; playlist: who made it.
  string artist = 4;
  int64 cover_media_id = 5;
  // Playlist: the first 50 tracks. Song: just that one.
  repeated MusicTrack tracks = 6;
}

// ---- an AI's own portrait pack (docs/design.md §9 AI 形象) ----

// GET /api/v1/users/{id}/portraits -> PortraitPack (anyone);
// PUT /api/v1/ai/{id}/portraits takes PortraitPack (its owner): mood -> media id
// of an image the owner uploaded. Moods are lower-case keys (≤16 characters),
// at most 24. An empty map goes back to the default pack.
message PortraitPack {
  map<string, int64> media_ids = 1;
}

// ---- asking to talk with someone's AI (共享聊天) ----

// POST /api/v1/ai/{id}/share-request -> Empty: I ask its owner (a push tells
// them). GET /api/v1/ai/{id}/share-requests -> ShareRequests (owner).
// POST /api/v1/ai/{id}/share-requests/{user} takes DecideShareRequest ->
// Conversation (approved: its shared room, made if needed) or Empty.
message ShareRequests {
  repeated User users = 1;
}

message DecideShareRequest {
  bool approve = 1;
}

// ---- board games (docs/design.md §13 小游戏) ----

message OpenGameRequest {
  string kind = 1;
  bool auto_approve = 2;
}

message ListGamesResponse {
  repeated Game games = 1;
}

message GameActRequest {
  // move (x, y) | say (text) | vote (target seat) | resign
  // 数字迷踪: ask (target seat, text = gt / lt / mult / odd / even, x) | guess (target seat, x)
  // 星屿鱼塘: sit (target seat 0-11) | reel | steal (target seat 0-11)
  string action = 1;
  int32 x = 2;
  int32 y = 3;
  string text = 4;
  int32 target = 5;
}

message SetGameRequest {
  bool auto_approve = 1;
}

message DecideGameRequest {
  bool approve = 1;
}

// ---- AI plugins (docs/plugins.md, docs/design.md §10) ----

// One setting of a plugin, for the generated settings form.
message PluginConfigItem {
  string key = 1;
  string label = 2;
  string help = 3;
  // string | int | float | bool | list | path | select | text
  string type = 4;
  // The plugin's default as JSON ("" = unknown).
  string default_json = 5;
  repeated string options = 6;
  string group = 7;
  // Secret values are never sent back; see AIPlugin.secrets_set.
  bool secret = 8;
  optional double min = 9;
  optional double max = 10;
}

message AIPlugin {
  int64 id = 1;
  int64 ai_id = 2;
  // Package (folder) name.
  string dir = 3;
  string name = 4;
  string description = 5;
  string usage = 6;
  repeated string commands = 7;
  // pip packages it needs.
  repeated string requires = 8;
  repeated PluginConfigItem config_items = 9;
  // Current settings as a JSON object, secret ones left out.
  string config_json = 10;
  // Secret settings that have a value.
  repeated string secrets_set = 11;
  // pending | approved | rejected
  string status = 12;
  string reject_reason = 13;
  bool enabled = 14;
  int64 uploaded_at = 15;
}

// GET /api/v1/ai/{id}/plugins -> ListPluginsResponse
message ListPluginsResponse {
  repeated AIPlugin plugins = 1;
  // The AI's plugin process: off | preparing | starting | running | error
  string host_state = 2;
  string host_error = 3;
  // Its last log lines.
  repeated string log = 4;
  // What commands start with (config plugins.command_start), so the AI's own
  // runner can leave plugin commands to the plugins.
  repeated string command_start = 5;
}

// POST /api/v1/ai/{id}/plugins -> ListPluginsResponse (the plugins in the zip)
message UploadPluginsRequest {
  // An uploaded .zip (POST /api/v1/media).
  int64 media_id = 1;
}

// PATCH /api/v1/ai/{id}/plugins/{plugin} -> AIPlugin
message UpdatePluginRequest {
  optional bool enabled = 1;
  // Settings patch, a JSON object: key -> value sets it, key -> null goes
  // back to the default, keys left out stay as they are. "" = no change.
  string config_json = 2;
}

// ---- the channel museum (docs/design.md §13 博物馆) ----

message MuseumArt {
  int64 id = 1;
  int64 media_id = 2;
  string title = 3;
  int64 by_user_id = 4;
  // "投稿", or how an AI made it ("NovelAI V5").
  string method = 5;
  bool nsfw = 6;
  int32 likes = 7;
  // I liked it.
  bool liked = 8;
  // When it last went up (unix ms; 0 = never).
  int64 hung_at = 9;
  // First hall position 1–8; 0 = in the warehouse.
  int32 slot = 10;
  // The channel whose hall it is in (second hall: where it comes from).
  int64 conv_id = 11;
  string conv_name = 12;
  // NSFW and this channel doesn't allow it: no picture.
  bool hidden = 13;
}

message MuseumVote {
  int64 id = 1;
  string text = 2;
  int64 by_user_id = 3;
  int64 ends_at = 4;
  int32 yes = 5;
  int32 no = 6;
  // My ballot: 1 agree, -1 against, 0 not yet.
  int32 mine = 7;
  // The picture, when it's about hanging a new one.
  int64 media_id = 8;
}

// GET /api/v1/conversations/{id}/museum -> MuseumView
message MuseumView {
  // The first hall: one entry per position (id 0 = empty).
  repeated MuseumArt hall = 1;
  // The second hall: the most liked across (public) channels.
  repeated MuseumArt second = 2;
  // This channel's warehouse, newest first.
  repeated MuseumArt store = 3;
  repeated MuseumVote votes = 4;
  // Changes need a vote here (more members than museum.min_members).
  bool needs_vote = 5;
  int32 vote_minutes = 6;
}

// POST /api/v1/conversations/{id}/museum/hang -> MuseumResult
message MuseumHangRequest {
  // A picture in this channel's chat (new work), or
  int64 event_id = 1;
  // a work from this channel's warehouse / hall (moved to `slot`).
  int64 art_id = 2;
  string title = 3;
  // 1–8 = that position (others move back; the last one goes to the
  // warehouse when the hall is full), 0 = the first empty one.
  int32 slot = 4;
  bool nsfw = 5;
}

// POST /api/v1/conversations/{id}/museum/remove (art_id) and
// POST /api/v1/conversations/{id}/museum/swap (a, b) -> MuseumResult
message MuseumActRequest {
  int64 art_id = 1;
  int32 a = 2;
  int32 b = 3;
}

message MuseumResult {
  // Done now (no vote needed); otherwise a vote started.
  bool done = 1;
  string text = 2;
  int64 vote_id = 3;
}

// POST /api/v1/museum/votes/{id} -> MuseumVote
message MuseumVoteRequest {
  bool agree = 1;
}

message EmojiPin {
  int64 id = 1;
  int64 conv_id = 2;
  int64 target_event_id = 3;
  int64 user_id = 4;
  string emoji = 5;
  double x = 6;
  double y = 7;
  int64 revision = 8;
  bool removed = 9;
  bool on_bubble = 10;
}
message ListEmojiPinsResponse {
  repeated EmojiPin pins = 1;
}

// POST /api/v1/helper/run: someone (usually an AI) has the server's built-in
// bot run a command without posting the command. show = the bot's answers
// are posted in the conversation as usual; otherwise nothing is posted and
// the answers come back here.
message HelperRunRequest {
  int64 conv_id = 1;
  // The command with its "/", e.g. "/资讯 dota2".
  string text = 2;
  // A message the command is about (e.g. the picture for /投厕).
  int64 reply_to = 3;
  bool show = 4;
}

message HelperRunResponse {
  // The bot's answers (when not shown: what it would have said).
  repeated string texts = 1;
  // Pictures it would have sent (not shown).
  repeated int64 media_ids = 2;
  // The answers were posted in the conversation.
  bool shown = 3;
}

// One command of the built-in bot (or one an AI answers), for 指令查询 and AIs.
message HelperCommand {
  string name = 1;
  repeated string aliases = 2;
  string group = 3;
  string usage = 4;
  string help = 5;
  // The bot runs it (false: an AI's drawing command, listed only).
  bool own = 6;
}

// GET /api/v1/helper/commands
message HelperCommandsResponse {
  repeated HelperCommand commands = 1;
}

// Persistent fishing data; state_json is versioned in docs/fishing.md.
message FishingData {
  string state_json = 1;
}
message FishingActionRequest {
  string action = 1; // sell | buy_tool | equip | unequip | buy_pack | open_pack
  string item = 2;
  int32 quality = 3;
  repeated string fish_ids = 4;
  string request_id = 5; // idempotency key, reused on retry
}
