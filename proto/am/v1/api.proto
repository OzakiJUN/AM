syntax = "proto3";

package am.v1;

option go_package = "github.com/OzakiJUN/am/gen/go/am/v1;amv1";

import "am/v1/common.proto";

// HTTP API messages.
//
// HTTP bodies are these messages encoded as protobuf JSON (protojson):
// field names in lowerCamelCase, 64-bit integers as strings.
// Authenticated endpoints need the header `Authorization: Bearer <token>`.
// Errors return a non-2xx status with an `Error` body.

// POST /api/v1/register
message RegisterRequest {
  string invite_code = 1;
  string username = 2;
  string password = 3;
  string display_name = 4;
  string device_name = 5;
}

// POST /api/v1/login
message LoginRequest {
  string username = 1;
  string password = 2;
  string device_name = 3;
  // Only for accounts that left the server: an unused invite code lets them
  // back in (used up like a registration). Ignored for everyone else.
  string invite_code = 4;
}

// Response of register and login.
message SessionResponse {
  string token = 1;
  User me = 2;
}

// GET /api/v1/sessions
message ListSessionsResponse {
  repeated DeviceSession sessions = 1;
  // Most devices a human account may be logged in on (limits.max_devices);
  // 0 = no limit.
  int32 max_devices = 2;
}

// POST /api/v1/logout logs out the device making the request (empty body).

// POST /api/v1/pair: a one-time ticket that logs in a new device of mine
// (docs/design.md §7, 多设备). Refused with too_many_devices when the
// account is already on limits.max_devices devices. A new ticket replaces
// the previous unused one.
message CreatePairTicketRequest {
  // Encrypted data for the new device, at most 32 KiB; kept with the ticket
  // and handed over when it is redeemed. Opaque to the server.
  bytes bundle = 1;
}

message PairTicket {
  string ticket = 1;
  int64 expires_at = 2;
}

// POST /api/v1/pair/redeem (no token): uses up the ticket and logs the new
// device in. invalid_pair_code when it is wrong, used or expired.
message RedeemPairTicketRequest {
  string ticket = 1;
  string device_name = 2;
}

message PairRedeemResponse {
  string token = 1;
  User me = 2;
  bytes bundle = 3;
}

// GET /api/v1/me/client-state: data shared by my devices (the list of my
// servers), encrypted by the client. Empty data and updated_at 0 = none yet.
message ClientState {
  bytes data = 1;
  int64 updated_at = 2;
}

// PUT /api/v1/me/client-state (replies ClientState). At most 32 KiB.
// state_conflict when another device saved since base_updated_at.
message PutClientStateRequest {
  bytes data = 1;
  int64 base_updated_at = 2;
}

message DeviceSession {
  int64 id = 1;
  string device_name = 2;
  int64 created_at = 3;
  int64 last_seen = 4;
  // True for the session making this request.
  bool current = 5;
}

// DELETE /api/v1/sessions/{id} -> Empty

// GET /api/v1/invites   (list my codes)
// POST /api/v1/invites  (create one, if under the per-user limit)
message ListInvitesResponse {
  repeated Invite invites = 1;
  // How many more codes this user can still create.
  int32 remaining = 2;
}

message Invite {
  string code = 1;
  int64 created_at = 2;
  // 0 = unused.
  int64 used_by = 3;
  string used_by_name = 4;
  // Join code: server address + certificate pin + this invite code in one
  // obfuscated string (see docs/protocol.md). Empty when the server has no
  // public address set; clients then build it from the address they use.
  string join_code = 5;
  // URL for a QR code: the client download page with "#join=<join_code>".
  string join_url = 6;
}

// GET /api/v1/server (no login needed)
message ServerInfo {
  string name = 1;
  string version = 2;
  // Client download page; QR codes point here.
  string download_url = 3;
  // Server icon ("/api/v1/server/icon?v=..."), "" when none is set. Public.
  string icon = 4;
}

// Who may rearrange the widgets on the server profile.
enum ProfileEditors {
  PROFILE_EDITORS_UNSPECIFIED = 0;
  // Site admins only (default).
  PROFILE_EDITORS_ADMINS = 1;
  PROFILE_EDITORS_EVERYONE = 2;
}

// GET /api/v1/server/profile: the server's profile page. Set up by the site
// admin in the admin panel.
message ServerProfile {
  string name = 1;
  string description = 2;
  // Same as ServerInfo.icon.
  string icon = 3;
  // Accounts that are not banned and have not left.
  int32 member_count = 4;
  // Online and not invisible.
  int32 online_count = 5;
  ProfileEditors layout_editors = 6;
  // Members may change what is inside widgets (never their kind or place).
  // When on, each widget can also get its own rule (widgets: later batch).
  bool widget_content_editable = 7;
}

// ---- friends (removed) ----
// There are no friends any more (stage 1 batch 4): everyone on a server can
// message everyone else. These messages and endpoints are gone; the
// messages stay only so their names and field numbers are never reused.

// Removed: GET /api/v1/friends
message ListFriendsResponse {
  repeated User friends = 1;
  repeated User incoming = 2;
  repeated User outgoing = 3;
}

// Removed: POST /api/v1/friends/request
message FriendRequest {
  string username = 1;
}

// Removed: POST /api/v1/friends/accept
message FriendAccept {
  int64 user_id = 1;
}

// ---- people ----

// POST /api/v1/dm   -> Conversation
// Opens (or returns the existing) DM with anyone on the server, unless one
// of the two has blocked the other ("blocked").
message OpenDMRequest {
  int64 user_id = 1;
}

// GET /api/v1/users?query=&after=&limit=   -> ListUsersResponse
// Everyone on the server (not banned), ordered by id. `query` matches
// username or display name. Page with `after` = last id of the previous page.
message ListUsersResponse {
  repeated User users = 1;
  // Pass as `after` for the next page; 0 = no more.
  int64 next_after = 2;
}

// GET    /api/v1/blocks             -> ListBlocksResponse
// POST   /api/v1/blocks/{user_id}   -> Empty
// DELETE /api/v1/blocks/{user_id}   -> Empty
// A block stops direct messages both ways; channels are not affected.
message ListBlocksResponse {
  repeated User users = 1;
}

// GET /api/v1/conversations/{id}   -> Conversation (must be a member)
// GET /api/v1/users/{id}           -> User

// PATCH /api/v1/me   -> User
message UpdateProfileRequest {
  optional string display_name = 1;
  // Media id of an uploaded image (GIF allowed). 0 removes the avatar.
  optional int64 avatar_media_id = 2;
  // Personal signature, at most 100 characters. Empty clears it.
  optional string bio = 3;
}

// PUT /api/v1/me/presence -> Presence (as the user themselves sees it).
// Saved on the server, so it stays after reconnecting or restarting.
message SetPresenceRequest {
  // Appear offline to everyone except yourself and your own bot / ai
  // accounts (so your AI knows you are around and may give it away).
  bool invisible = 1;
  // Empty / UNSPECIFIED clears the activity.
  Activity activity = 2;
}

// GET /api/v1/me/logins
message ListLoginRecordsResponse {
  repeated LoginRecord records = 1;
}

message LoginRecord {
  // "login" or "register"
  string kind = 1;
  string ip = 2;
  string device_name = 3;
  int64 created_at = 4;
}

// ---- channels (groups) ----
// Clients call groups "channels". Public channels are open to everyone on
// the server; private ones are invite only (the old groups).

// POST /api/v1/groups   -> Conversation
message CreateGroupRequest {
  string name = 1;
  repeated int64 member_ids = 2;
  // Public channel: only site admins may create one. Every account on the
  // server becomes a member (member_ids is ignored).
  bool public = 3;
}

// GET /api/v1/channels   -> ListChannelsResponse
// All public channels, for the "browse channels" list.
message ListChannelsResponse {
  repeated ChannelInfo channels = 1;
}

message ChannelInfo {
  int64 id = 1;
  string name = 2;
  string avatar = 3;
  string notice = 4;
  int32 member_count = 5;
  // The caller is a member.
  bool joined = 6;
}

// POST /api/v1/channels/{id}/join   -> Conversation
// Join a public channel (e.g. after leaving it).

// POST /api/v1/groups/{id}/members
// Invite people. In groups with join approval, invitations by ordinary
// members become join requests for admins to approve.
message InviteMembersRequest {
  repeated int64 user_ids = 1;
}

message InviteMembersResponse {
  repeated int64 added = 1;
  repeated int64 requested = 2;
}

// DELETE /api/v1/groups/{id}/members/{user_id}   -> Empty
// Your own id = leave; someone else's = kick.

// PATCH /api/v1/groups/{id}   -> Conversation
message UpdateGroupRequest {
  optional string name = 1;
  // Media id of an uploaded image. 0 removes the avatar.
  optional int64 avatar_media_id = 2;
  optional string notice = 3;
  optional bool join_approval = 4;
}

// POST   /api/v1/groups/{id}/admins/{user_id}  -> Empty   (owner only)
// DELETE /api/v1/groups/{id}/admins/{user_id}  -> Empty

// POST /api/v1/groups/{id}/transfer   -> Empty   (owner only)
message TransferGroupRequest {
  int64 user_id = 1;
}

// DELETE /api/v1/groups/{id}   -> Empty   (owner only; dissolves the group)

// POST /api/v1/groups/{id}/mute   -> Empty
message MuteMemberRequest {
  int64 user_id = 1;
  // How long to mute, in seconds. 0 = unmute.
  int64 duration_seconds = 2;
}

// GET /api/v1/groups/{id}/requests
message ListJoinRequestsResponse {
  repeated JoinRequestInfo requests = 1;
}

message JoinRequestInfo {
  User user = 1;
  User inviter = 2;
  int64 created_at = 3;
}

// POST /api/v1/groups/{id}/requests/{user_id}/approve  -> Empty
// POST /api/v1/groups/{id}/requests/{user_id}/reject   -> Empty

// ---- moderation ----

// POST /api/v1/events/{event_id}/delete   -> Empty
// Group owner / admins (for messages of lower-ranked members) and site admins.
message AdminDeleteRequest {
  string reason = 1;
  // Also add the image's fingerprint to the blocklist.
  bool block_media = 2;
}

// ---- media ----

// POST /api/v1/media   (multipart/form-data, field "file")  -> MediaInfo
// GET  /api/v1/media/{id}         original file
// GET  /api/v1/media/{id}/thumb   thumbnail / static first frame (images)
message MediaInfo {
  int64 id = 1;
  string mime = 2;
  int64 size = 3;
  int32 width = 4;
  int32 height = 5;
  string name = 6;
  bool is_image = 7;
  string url = 8;
  string thumb_url = 9;
}

message Empty {}
