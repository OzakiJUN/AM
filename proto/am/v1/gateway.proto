syntax = "proto3";

package am.v1;

option go_package = "github.com/OzakiJUN/am/gen/go/am/v1;amv1";

import "am/v1/common.proto";
import "am/v1/event.proto";

// WebSocket protocol.
//
// One binary WebSocket message = one encoded ClientFrame / ServerFrame.
// The first frame a client sends must be `auth`; anything else before a
// successful auth closes the connection.
//
// Requests carry a client-chosen req_id; the server answers with the same
// req_id. Server-initiated pushes use req_id = 0.

message ClientFrame {
  uint64 req_id = 1;
  oneof msg {
    AuthRequest auth = 10;
    SendRequest send = 11;
    SyncRequest sync = 12;
    MarkReadRequest mark_read = 13;
    Ping ping = 14;
    // An AI asks a person's devices to run a computer tool (they decide).
    RemoteToolRequest remote_tool = 15;
    // A person's device answers an AI's remote_tool.
    RemoteToolResult remote_tool_result = 16;
  }
}

message ServerFrame {
  uint64 req_id = 1;
  oneof msg {
    Error error = 10;
    AuthResponse auth = 11;
    SendResponse send = 12;
    SyncResponse sync = 13;
    MarkReadResponse mark_read = 14;
    Pong pong = 15;
    // Reply to remote_tool / remote_tool_result: the server passed it on.
    Ack ack = 16;

    // Pushes (req_id = 0).
    EventPush event = 30;
    ConvPush conv = 31;
    // Removed with friends; never sent.
    FriendPush friend = 32;
    ConvRemovedPush conv_removed = 33;
    JoinRequestPush join_request = 34;
    PresencePush presence = 35;
    ClientStatePush client_state = 36;
    ServerMovedPush server_moved = 37;
    RemoteToolPush remote_tool = 38;
    RemoteToolResultPush remote_tool_result = 39;
    AIShareRequestPush ai_share_request = 40;
    // A board game in one of my conversations changed (my own view of it).
    Game game = 41;
  }
}

message AuthRequest {
  // Session token from /api/v1/login or /api/v1/register.
  string token = 1;
  // The address (host:port) the client connected to, so the admin panel
  // can tell how many devices still use an old relay address.
  string address = 2;
}

message AuthResponse {
  User me = 1;
  // All conversations the user is in, with their own state. The client
  // compares each last_seq with what it has locally and then syncs.
  repeated Conversation conversations = 2;
  // Site admin of this server: may create public channels.
  bool is_site_admin = 3;
  // Everyone who is online as this user sees it (includes the user
  // themselves, with `invisible` set if they are). Changes arrive as
  // `presence` pushes.
  repeated Presence presences = 4;
  // The server's public address (server.public_address), "" when not set.
  // A client using another address checks the new one (same certificate)
  // and switches to it (docs/design.md §3, 更换中转地址).
  string public_address = 5;
}

message SendRequest {
  int64 conv_id = 1;
  // Required. A random id from the client; resending with the same id
  // returns the original event instead of creating a second one.
  string client_msg_id = 2;
  oneof body {
    TextMsg text = 10;
    ImageMsg image = 11;
    FileMsg file = 12;
    ForwardRequest forward = 13;
    EmojiPinAct emoji_pin = 22;
    StrikeAct strike = 20;
  }
}

message SendResponse {
  Event event = 1;
}

message SyncRequest {
  repeated SyncCursor cursors = 1;
  // Max events per conversation in this response. Server caps it.
  int32 limit = 2;
}

message SyncCursor {
  int64 conv_id = 1;
  // Return events with seq > after_seq.
  int64 after_seq = 2;
}

message SyncResponse {
  // Ordered by conv_id, then seq.
  repeated Event events = 1;
  // Conversations that still have more events after this page.
  repeated int64 has_more = 2;
}

message MarkReadRequest {
  int64 conv_id = 1;
  int64 seq = 2;
}

message MarkReadResponse {}

message Ping {}
message Pong {}

// A new event in one of the user's conversations.
message EventPush {
  Event event = 1;
}

// A conversation was created or its info / member list changed.
message ConvPush {
  Conversation conversation = 1;
}

// Removed with friends (stage 1 batch 4); never sent. Kept so field
// number 32 is never reused.
message FriendPush {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    // Someone sent you a friend request.
    KIND_REQUEST_RECEIVED = 1;
    // Someone accepted your request.
    KIND_ACCEPTED = 2;
  }
  Kind kind = 1;
  User user = 2;
}

// You are no longer in a conversation (left, kicked, or group dissolved).
// The client keeps the history read-only.
message ConvRemovedPush {
  int64 conv_id = 1;
  enum Reason {
    REASON_UNSPECIFIED = 0;
    REASON_LEFT = 1;
    REASON_KICKED = 2;
    REASON_DISSOLVED = 3;
  }
  Reason reason = 2;
}

// A member invited someone into a group that needs approval.
// Sent to the group's owner and admins.
message JoinRequestPush {
  int64 conv_id = 1;
  User user = 2;
  User inviter = 3;
}

// Someone's online state or activity changed, as the receiver sees it.
// Sent to everyone online on the server. online = false means offline (or
// invisible, for everyone but the user and their own bot / ai accounts).
message PresencePush {
  Presence presence = 1;
}

// One of my devices saved the state my devices share (PUT
// /api/v1/me/client-state): load it again. Sent to all my connections.
message ClientStatePush {
  int64 updated_at = 1;
}

// The server moved to a new public address (the admin changed the relay).
// Sent to everyone online; the client connects to the new address with the
// same certificate pin and switches only when that works.
message ServerMovedPush {
  string address = 1;
}

message Ack {}

// ---- someone else's AI operating my computer (docs/design.md §9) ----
// The server only relays: it checks who may ask whom, and the person's own
// device decides with its local settings (off unless turned on for that AI).

// From an AI (bot / ai account) to a person. request_id ≤ 64 characters,
// args_json ≤ 16 KiB. Errors: user_not_found, blocked, no_permission,
// rate_limited (more than 30 a minute).
message RemoteToolRequest {
  string request_id = 1;
  int64 to_user_id = 2;
  string tool = 3;
  string args_json = 4;
}

message RemoteToolPush {
  string request_id = 1;
  User from_ai = 2;
  string tool = 3;
  string args_json = 4;
}

// From the person's device back to the AI. text ≤ 64 KiB, at most 2 images
// (base64), all together under 900 KiB.
message RemoteToolResult {
  string request_id = 1;
  int64 to_ai_id = 2;
  bool ok = 3;
  string text = 4;
  repeated string images = 5;
}

message RemoteToolResultPush {
  string request_id = 1;
  // Who answered (the AI checks it is the person it asked).
  int64 from_user_id = 2;
  bool ok = 3;
  string text = 4;
  repeated string images = 5;
}

// To an AI's owner: someone asks to talk with it.
message AIShareRequestPush {
  int64 ai_id = 1;
  User user = 2;
}

message ForwardRequest {
  int64 source_conv_id = 1;
  repeated int64 event_ids = 2;
  // Cross-server copies. Media must already be uploaded by the sender here.
  repeated ForwardEntry imported_entries = 3;
  string source_server = 4;
}
