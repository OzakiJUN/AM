syntax = "proto3";

package am.v1;

option go_package = "github.com/OzakiJUN/am/gen/go/am/v1;amv1";

import "am/v1/common.proto";

// Everything that happens in a conversation is an Event.
// Events are append-only: striking a message or an admin deletion is a new
// event that points at the original one. Clients rebuild the view from the
// event stream.
message Event {
  // Global, time-ordered 64-bit id (snowflake).
  int64 event_id = 1;
  int64 conv_id = 2;
  // Per-conversation sequence number, starts at 1, no gaps.
  int64 seq = 3;
  int64 sender_id = 4;
  // Server time, unix ms.
  int64 created_at = 5;
  // Client-generated id used to de-duplicate resends. Only echoed back to
  // the sender's own devices; empty for other members.
  string client_msg_id = 6;

  oneof body {
    TextMsg text = 10;
    ImageMsg image = 11;
    FileMsg file = 12;
    ForwardMsg forward = 13;
    EmojiPinAct emoji_pin = 22;
    StrikeAct strike = 20;
    AdminDeleteAct admin_delete = 21;
    SysMember sys_member = 30;
    SysConv sys_conv = 31;
    SysMuseum sys_museum = 32;
  }

  // Set when an admin deleted this event. The body is then empty: the
  // content has been removed from the server for real.
  Redaction redaction = 40;
}

message TextMsg {
  string text = 1;
  // Event this message replies to. 0 = not a reply.
  int64 reply_to = 2;
  repeated int64 mentions = 3;
  // Mood of an AI reply (emotion key from docs/design.md §9, e.g. "happy"),
  // shown by the AI portrait. Only kept on messages from ai / bot accounts.
  string mood = 4;
}

message ImageMsg {
  int64 media_id = 1;
  int32 width = 2;
  int32 height = 3;
  // Sent from the sticker panel: the sticker's tags (at most 10, 20 characters
  // each). AIs read these instead of looking at the picture.
  repeated string sticker_tags = 4;
  // How an AI made it (e.g. "NovelAI V5"); only kept on ai / bot messages.
  string made_with = 5;
  // An AI drew it with adult content; only kept on ai / bot messages.
  bool nsfw = 6;
  // Who asked the AI to draw it (a member of this conversation); only kept
  // on ai / bot messages. The 电子厕所 names them as the culprit.
  int64 made_for = 7;
  // What was asked for (at most 200 characters); only kept on ai / bot
  // messages. Used to name a picture.
  string made_from = 8;
}

message FileMsg {
  int64 media_id = 1;
  string name = 2;
  int64 size = 3;
}

// The sender strikes through one of their own earlier messages.
// The original stays visible with a strike-through. Cannot be undone.
message StrikeAct {
  int64 target_event_id = 1;
}

// An admin deleted a message. The target's content is purged; this event
// keeps the record of who did it and why.
message AdminDeleteAct {
  int64 target_event_id = 1;
  string reason = 2;
}

message Redaction {
  int64 deleted_by = 1;
  string reason = 2;
  int64 deleted_at = 3;
}

// Membership changes, generated by the server.
message SysMember {
  enum Action {
    ACTION_UNSPECIFIED = 0;
    ACTION_JOIN = 1;
    ACTION_LEAVE = 2;
    ACTION_KICK = 3;
    ACTION_MUTE = 4;
    ACTION_UNMUTE = 5;
    ACTION_ROLE_CHANGE = 6;
  }
  Action action = 1;
  int64 target_user_id = 2;
  int64 operator_id = 3;
  // For ACTION_MUTE: until when (unix ms).
  int64 until = 4;
  // For ACTION_ROLE_CHANGE.
  MemberRole new_role = 5;
}

// Conversation info changes, generated by the server.
message SysConv {
  int64 operator_id = 1;
  // Only the fields that changed are set.
  optional string name = 2;
  // New avatar URL ("" = removed).
  optional string avatar = 3;
  optional string notice = 4;
  // The group was dissolved; it is now read-only history.
  bool dissolved = 5;
  optional bool join_approval = 6;
  // Set when the group was just created.
  bool created = 7;
  optional bool nsfw = 8;
}

// The channel's museum (docs/design.md §13 博物馆), generated by the server:
// a proposal to vote on, its result, or a change made without a vote.
message SysMuseum {
  // proposed | passed | failed | done
  string kind = 1;
  int64 operator_id = 2;
  // What happens, in words (e.g. "把《夕阳》挂进第一展厅 No.3").
  string text = 3;
  int64 vote_id = 4;
  // proposed: when the vote ends (unix ms).
  int64 ends_at = 5;
  int64 art_id = 6;
  // The picture a proposal to hang is about.
  int64 media_id = 7;
  int32 yes = 8;
  int32 no = 9;
}

// A server-stamped snapshot of selected chat messages.
message ForwardMsg {
  repeated ForwardEntry entries = 1;
}
message ForwardEntry {
  int64 source_conv_id = 1;
  string source_name = 2;
  int64 source_event_id = 3;
  int64 sender_id = 4;
  string sender_name = 5;
  int64 sent_at = 6;
  bool struck = 7;
  oneof body {
    TextMsg text = 10;
    ImageMsg image = 11;
    FileMsg file = 12;
  }
}
// Position is relative to an anchor message: horizontal fraction of the
// message row, vertical pixel offset from its top. remove_pin_id removes a pin.
message EmojiPinAct {
  int64 target_event_id = 1;
  string emoji = 2;
  double x = 3;
  double y = 4;
  int64 remove_pin_id = 5;
  // On a bubble, x and y are fractions; otherwise y is a row pixel offset.
  bool on_bubble = 6;
}
