# AM server configuration.
# This file was generated automatically. Edit values here; never edit code.

[server]
# Server name shown in clients and in the connection code.
name = "AM 服务器"
# Address and port the server listens on.
listen = "0.0.0.0:8443"
# How clients reach this server from outside: public IP or domain plus port,
# e.g. "47.1.2.3:7000" (behind frp: the relay's IP and remote port). Used for
# the connection code. Can be filled in from the admin panel.
public_address = ""
# Unique number per server process (0-1023). Keep 1 unless you run several.
node_id = 1
# Folder for generated files (database, TLS certificate, uploads, bootstrap invite).
data_dir = "data"
# Set to true ONLY if all outside traffic arrives through frp (or another proxy)
# with proxy protocol enabled. Then the real client IP is used for login records
# and rate limits. Headers are trusted only from local (127.0.0.1 / ::1) connections.
proxy_protocol = false
# Public channel created automatically when the first (admin) account
# registers, so a new server is not empty. Everyone joins public channels
# automatically. Leave empty to not create one.
default_channel = "大厅"

[tls]
# "self_signed": generate a certificate on first start (clients pin its fingerprint).
# "files":       use cert_file / key_file (e.g. a real certificate after you get a domain).
# "off":         plain HTTP, only for local testing or behind a reverse proxy.
mode = "self_signed"
# Addresses written into the self-signed certificate. Add your public IP or domain here.
hosts = ["127.0.0.1", "localhost"]
cert_file = ""
key_file = ""

[database]
# "sqlite" (default): a single file in data_dir, nothing to install.
# "postgres": for larger servers; run "am-server setup-db" once to create the database.
driver = "sqlite"
sqlite_file = "am.db"
url = "postgres://am:__DB_PASSWORD__@127.0.0.1:5432/am?sslmode=disable"
max_conns = 10

[invites]
# Every account gets this many invite codes automatically when it registers.
per_user = 3
# Site admins can ask for more codes beyond per_user.
admin_unlimited = true
# Client download page. QR codes point here (with the join code after "#join="):
# other scanner apps open this page, the AM client reads the code.
download_url = "https://github.com/OzakiJUN/AM/releases/latest"

[limits]
max_text_length = 5000
# Events returned per conversation in one sync page.
sync_page_size = 200
sync_max_page_size = 500
# Login / register attempts allowed per IP per minute.
login_attempts_per_minute = 10
max_group_members = 500
# Largest upload (image or file) in MB.
max_upload_mb = 50
# Most devices one account may be logged in on at the same time (phones and
# computers alike; bot / AI accounts do not count). When full, logging in on
# another device or making a pairing code is refused until one logs out.
# 0 = no limit.
max_devices = 3
# How long a "add a new device" pairing code works, in minutes.
pair_code_minutes = 5
# How many AI accounts one person may create (they run on the owner's device).
max_ai_per_user = 5
# How many stickers one person may keep in their collection.
max_stickers = 1000
# How many board games (五子棋, 黑白棋, 谁是卧底) may be open or running at
# once in one channel or shared AI room. 0 = games are turned off.
max_games_per_conv = 3

[retention]
# How long admin-deleted content is kept in the evidence store before it is
# purged automatically. Regulations expect at least 180 days.
evidence_days = 180
# How long login records (time, IP, device) are kept. At least 180 days.
login_record_days = 180
# How long finished board games stay in a channel's game history (对局记录).
games_days = 180

[media]
# Images whose fingerprint is within this distance of a blocked image are
# rejected (0-64; lower = stricter match). 6 catches re-saved / resized copies.
block_distance = 6
# Music widgets may take NetEase Cloud Music links: the server reads the
# song / playlist (title, artist, cover) from this address. Playing still
# streams from NetEase on the listener's device, only after they press play.
netease = true
netease_api = "https://music.163.com"

[stickers]
# Combined background sticker upload bandwidth for this server (KiB/s, 0 = unlimited).
sync_kbps = 64
# The shared sticker library: stickers people add to their collection are
# shared with everyone on this server (one copy per picture, earliest
# uploader shown); everyone can add tags. Turned off = only personal
# collections, as before.
library = true
# New stickers are shared unless the person marks them private. false =
# private unless they choose to share.
default_public = true
# How alike two pictures must be to count as the same one: how many of the
# 256 fingerprint bits may differ (0-64; 0 = only identical files). Measured:
# re-saved / resized copies differ by 4 or less, the same picture with
# different words underneath by 36 or more. 10 merges copies safely.
dedupe_distance = 10

[plugins]
# NoneBot2 (OneBot v11) plugins of AI accounts (docs/plugins.md): owners
# upload them in the AI's settings, and they run here on the server as that
# AI. Plugins are programs with full access to this computer, so each one
# runs only after a site admin approved it in the panel (插件 page).
# false = no plugins are uploaded or run.
enabled = true
# Python 3.10 or newer for the plugins' own virtual environment
# (data/plugins/venv). Empty = look for python3 / python / py -3.
python = ""
# pip mirror for installing the packages plugins need, e.g.
# "https://pypi.tuna.tsinghua.edu.cn/simple". Empty = pip's default.
pip_index = ""
# What commands start with (NoneBot COMMAND_START). Add "" to allow
# commands without a prefix ("帮助" as well as "/帮助").
command_start = ["/"]
# Largest plugin zip people may upload, and its size unpacked (MB).
max_zip_mb = 20
max_unpacked_mb = 100
# How many plugins one AI may have.
max_per_ai = 30

[hosting]
# AIs hosted on this server (docs/design.md §10): an owner asks in the AI's
# settings (运行 → 托管到服务器), a site admin approves in the panel (托管
# page), and am-server runs the AM client without a window for that AI, so
# the owner's computer can be off. The owner's model keys are stored here.
# The AI only gets its own work folder (data/hosting/ai-<id>/work) for files;
# screen, mouse, keyboard, commands and the browser are off.
# Windows only for now (it runs the desktop client).
enabled = true
# How many AIs one person may have hosted (0 = nobody).
max_per_user = 1
# The AM client (AM.exe) on this computer. Empty = look next to am-server
# and where the installer puts it.
client_path = ""

[admin]
# The admin panel is a web page served by am-server. Keep it on 127.0.0.1 so
# only this computer can open it. On a headless Linux server, reach it through
# an SSH tunnel (ssh -L 8444:127.0.0.1:8444 server) instead of opening it up.
listen = "127.0.0.1:8444"
# Open the admin panel when the server starts (desktop only).
open_browser = true
# Windows: show the panel in its own window instead of the browser
# (needs the WebView2 runtime, which Windows 10/11 already have).
window = true
# Show an icon in the Windows notification area (tray).
tray = true

[log]
# debug, info, warn, error
level = "info"
# Log file inside data_dir (also shown in the admin panel). Empty = no file.
file = "logs/am-server.log"
# When the log file grows beyond this size it is renamed to .1 and restarted.
max_size_mb = 10
