name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to publish releases on tags

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: am
          POSTGRES_PASSWORD: am
          POSTGRES_DB: am_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U am"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      - name: Check generated code is up to date
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go
          buf lint
          buf generate
          git diff --exit-code gen/
      - run: go vet ./...
      - name: Test (with race detector)
        env:
          AM_TEST_DATABASE_URL: postgres://am:am@127.0.0.1:5432/am_test?sslmode=disable
        run: go test -race ./...

  build-windows:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          VERSION="${GITHUB_REF_NAME}-$(git rev-parse --short HEAD)"
          mkdir -p dist/am
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o dist/am/am-server.exe ./server/cmd/am-server
          go build -trimpath -ldflags "-s -w" -o dist/am/am-testclient.exe ./tools/testclient
          cp scripts/windows/*.bat dist/am/
          cp docs/server-setup.md dist/am/README-server-setup.md
          cd dist && zip -r am-windows-amd64.zip am
      - uses: actions/upload-artifact@v4
        with:
          name: am-windows-amd64
          path: dist/am-windows-amd64.zip
      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/am-windows-amd64.zip
