name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: am
          POSTGRES_PASSWORD: am
          POSTGRES_DB: am_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U am"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Client dependencies (protoc-gen-es lives there)
        working-directory: client
        run: npm ci
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      - name: Check generated code is up to date
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go
          buf lint
          buf generate
          git diff --exit-code gen/ client/src/gen/
      - name: Client type check, join code test, build
        working-directory: client
        run: |
          npm run typecheck
          npm test
          npx vite build
      - run: go vet ./...
      - name: Vet the Windows build too
        run: GOOS=windows go vet ./...
      - name: Test (with race detector)
        env:
          AM_TEST_DATABASE_URL: postgres://am:am@127.0.0.1:5432/am_test?sslmode=disable
        run: go test -race ./...

  build:
    needs: test
    uses: ./.github/workflows/build.yml
    with:
      version: ""
